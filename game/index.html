<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>中北大学 · 像素校园漫步</title>
<link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
<canvas id="view"></canvas>
<div id="topleft" class="panel"><div id="clock">第 1 天 08:00</div><div id="area">中北大学</div></div>
<div id="quests" class="panel"><div class="qt">今日任务 <span class="small">（Q 收起）</span></div><div id="qlist"></div></div>
<div id="toast" class="panel"></div>
<div id="quiz" class="panel"></div>
<button id="mute" class="panel" aria-label="静音" title="V 静音/开声">🔊</button>
<div id="tip"></div>
<div id="intro" class="panel"><div class="it"></div><div class="is"></div><div class="ib"></div></div>
<div id="mmwrap" class="panel"><canvas id="minimap"></canvas></div>
<div id="hint" class="panel"></div>
<button id="ebtn" class="panel" aria-label="互动"><b>E</b><span id="ebtnlab"></span></button>
<div id="help" class="panel small">WASD/方向键 移动 · Shift 跑 · E 互动/进门 · M 地图 · Q 任务 · +/- 缩放(0.25×–4×) · V 声音 · J 季节 · T 天气 · N 快进1小时</div>
<div id="bigwrap"><div class="panel big"><div class="title">中北大学 · 校园地图 <span class="small">（点击地图可快速传送 · M 关闭）</span></div><canvas id="bigmap"></canvas></div></div>
<div id="loading" class="panel">正在加载校园……</div>
<script src="js/core.js"></script>
<script src="js/legacy_art.js"></script>
<script src="js/fields.js"></script>
<script src="js/ground.js"></script>
<script src="js/buildings.js"></script>
<script src="js/props.js"></script>
<script src="js/props_v7.js"></script>
<script src="js/props_v761.js"></script>
<script src="js/props_v762.js"></script>
<script src="js/props_v764.js"></script>
<script src="js/interiors.js"></script>
<script src="js/sound.js"></script>
<script src="data/tooltips.js"></script>
<script src="js/game.js"></script>
</body>
</html>
